<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SandboxJS</title>
    <script src="sandbox.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <div class = "left">
        <label for="applesAmount">Apples Amount</label><br>
        <input type="number" name="applesAmount" id="applesAmount" onchange="setApplesAmount()"><br>
        <label for="stepDelay">Max Step Delay</label><br>
        <input type="number" name="stepDelay" id="stepDelay" onchange="setStepDelay()">
    </div> -->

    <div class="main-layout">
        <div class="center">
            <br>
            <label for="log" id="log">SandboxJS</label>
            <br>
            <canvas id="canvas"></canvas>
            <br>
            <p id="grainName">Air</p>
            <div class="button-container" style="margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-direction: column; justify-content: center;">
                <div id="materialMenu">
                    <canvas id="grainMenu"></canvas>
                    <div>
                        <button onclick="prevGrain()" class="button-19"><</button>
                        <canvas id="materialPreview" width="48" height="48" ></canvas>
                        <button onclick="nextGrain()" class="button-19">></button>
                    </div>

                </div>
                <input type="range" id="brushSize" min="1" max="20" value="3" oninput="setBrushSize(this.value)">


            </div>

            <input type="file" id="fileInput" accept=".sx,.json" style="display:none">
            <button onclick="importFromFile()">Import</button>
            <button onclick="exportToFile()">Export</button>

        </div>
        <button class="open-btn" aria-label="Open grain info">
            <svg xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M2 4a2 2 0 0 1 2-2h6v20H4a2 2 0 0 1-2-2z"></path>
                <path d="M22 4a2 2 0 0 0-2-2h-6v20h6a2 2 0 0 0 2-2z"></path>
            </svg>
        </button>
        <div class="side-panel" id="side-panel">
            
            <div  class="side-panel-header">
                <h3 class="grain-name" id="side-panel-grain-name">Grain Name</h3>
                <button class="close-btn" aria-label="Close panel" id="close-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" 
                        width="20" 
                        height="20" 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" 
                        stroke-width="2" 
                        stroke-linecap="round" 
                        stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <p class="grain-description" id="side-panel-grain-description">this is base grain, has no functionality, may be affected by gravity</p>
            <canvas id="example-canvas"></canvas>
        </div>
    </div>
</body>
</html>
