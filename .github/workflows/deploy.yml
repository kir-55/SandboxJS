name: Deploy

on:
  push:
    branches:
      - main  # or master, whatever your branch is

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/SandboxJS
            git pull
            sudo npm install
            pm2 restart sandboxjs
